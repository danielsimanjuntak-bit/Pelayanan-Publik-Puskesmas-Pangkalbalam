<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Pengaduan — UPTD Puskesmas Pangkalbalam</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --accent: #2dd4bf;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background: linear-gradient(135deg, #f0fdf4 0%, #f8fafc 100%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .wrapper {
            max-width: 750px;
            width: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(15, 118, 110, 0.08), 0 8px 10px -6px rgba(15, 118, 110, 0.08);
            overflow: hidden;
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .hero-header {
            background: linear-gradient(135deg, var(--primary) 0%, #115e59 100%);
            color: white;
            padding: 35px 30px;
            text-align: center;
            position: relative;
        }

        .hero-header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 4px;
            background: var(--accent);
        }

        .logo-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 480px;
            margin: 0 auto 20px auto;
            padding: 0 10px;
        }

        .logo-item {
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 16px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            height: 65px;
            width: 80px;
        }

        .logo-item img {
            max-height: 50px;
            max-width: 100%;
            object-fit: contain;
        }

        .hero-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 5px;
            letter-spacing: -0.025em;
        }

        .hero-header p {
            font-size: 0.85rem;
            opacity: 0.9;
            font-weight: 400;
        }

        form { padding: 35px 30px; }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 2px solid #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group.full { grid-column: span 2; }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 0.95rem;
            color: var(--text-main);
            background-color: #ffffff;
            transition: all 0.25s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1);
        }

        textarea { resize: vertical; height: 110px; }

        .admin-box {
            background: #f8fafc;
            border: 1px dashed var(--border);
            border-radius: 14px;
            padding: 25px 20px 5px 20px;
            margin-top: 10px;
            margin-bottom: 25px;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 20px;
            width: 100%;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(15, 118, 110, 0.3);
        }

        footer {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 25px;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full { grid-column: span 1; }
            body { padding: 15px 10px; }
            .wrapper { border-radius: 14px; }
            form { padding: 20px 15px; }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="hero-header">
            <div class="logo-container">
                <div class="logo-item" title="Logo Kota Pangkalpinang">
                    <img src="Lambang_Kota_Pangkalpinang.png" alt="Logo Pemkot Pangkalpinang">
                </div>
                <div class="logo-item" title="Logo Puskesmas Pangkalbalam">
                    <img src="puskesmas-logo-png_seeklogo-359624.png" alt="Logo Puskesmas">
                </div>
            </div>

            <h1>UPTD Puskesmas Pangkalbalam</h1>
            <p>Portal Resmi Layanan Pengaduan & Penjaminan Mutu Layanan Kesehatan</p>
        </div>

        <form id="formPengaduan">
            
            <div class="section-title">📋 Informasi Pengaduan</div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Tanggal Pengaduan</label>
                    <input type="date" id="tanggal" name="tanggal" required>
                </div>

                <div class="form-group">
                    <label>Media Pengaduan</label>
                    <select id="media" name="media" required>
                        <option value="Website Resmi">🌐 Website Resmi</option>
                        <option value="WhatsApp Center">💬 WhatsApp Center</option>
                        <option value="Pengaduan Langsung">🏥 Pengaduan Langsung / Meja Informasi</option>
                        <option value="Media Sosial">📱 Media Sosial Resmi</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>Nama Pengirim / Pelapor</label>
                    <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap atau ketik 'Anonim'" required>
                </div>

                <div class="form-group full">
                    <label>Isi Aduan / Keluhan / Masukan</label>
                    <textarea id="isi" name="isi" placeholder="Jelaskan detail kronologi, unit pelayanan yang dituju, atau keluhan Anda..." required></textarea>
                </div>
            </div>

            <div class="admin-box">
                <div class="section-title" style="font-size: 0.85rem; margin-bottom: 15px; border-bottom: none;">🔒 Khusus Petugas Penanganan (Opsional)</div>
                
                <div class="form-grid">
                    <div class="form-group full">
                        <label>Tindak Lanjut Pengaduan (TL)</label>
                        <input type="text" id="tindakLanjut" name="tindakLanjut" placeholder="Contoh: Koordinasi dengan kepala unit poli terkait">
                    </div>

                    <div class="form-group">
                        <label>Tanggal TL</label>
                        <input type="date" id="tanggalTL" name="tanggalTL">
                    </div>

                    <div class="form-group">
                        <label>Status TL</label>
                        <select id="statusTL" name="statusTL">
                            <option value="Open">🔴 Open (Baru)</option>
                            <option value="Proses">🟡 Dalam Proses</option>
                            <option value="Selesai">🟢 Selesai</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Durasi Penyelesaian (Hari)</label>
                        <input type="number" id="durasi" name="durasi" placeholder="Contoh: 2">
                    </div>

                    <div class="form-group">
                        <label>Kesimpulan / Pelanggaran</label>
                        <select id="kesimpulan" name="kesimpulan">
                            <option value="Tidak Ada Pelanggaran">✔ Tidak Ada Pelanggaran</option>
                            <option value="Ada Pelanggaran Ringan">⚠ Ada Pelanggaran Ringan</option>
                            <option value="Ada Pelanggaran Berat">❌ Ada Pelanggaran Berat</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 15px;">
                <label for="lampiranFoto" style="display: block; font-weight: bold; margin-bottom: 5px;">
                    📷 Lampiran Bukti Foto / Dokumentasi (Opsional)
                </label>
                <input 
                    type="file" 
                    id="lampiranFoto" 
                    name="lampiran_foto" 
                    accept="image/png, image/jpeg, image/jpg" 
                    style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 6px;"
                >
                <small style="color: #666; font-size: 12px; display: block; margin-top: 4px;">
                    Format yang didukung: JPG, PNG, JPEG. Ukuran maks: 5 MB.
                </small>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <span>Kirim Pengaduan ke Sistem</span>
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
        </form>
    </div>

    <footer>
        <p>&copy; 2026 UPTD Puskesmas Pangkalbalam — Pemerintah Kota Pangkalpinang</p>
    </footer>

    <script>
        document.getElementById('tanggal').valueAsDate = new Date();

        // API Key ImgBB Anda
        const IMGBB_API_KEY = "f7c3851d5fb4093c7d1dca605b47bf49";

        document.getElementById('formPengaduan').addEventListener('submit', async function(e) {
            e.preventDefault();

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;
            btnSubmit.querySelector('span').innerText = "Mengunggah Foto & Data...";

            try {
                const fileInput = document.getElementById('lampiranFoto');
                let imageUrl = "";

                // 1. Unggah foto ke ImgBB jika ada berkas yang dipilih
                if (fileInput && fileInput.files.length > 0) {
                    const formData = new FormData();
                    formData.append("image", fileInput.files[0]);

                    const imgResponse = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                        method: "POST",
                        body: formData
                    });

                    const imgData = await imgResponse.json();
                    if (imgData.success) {
                        imageUrl = imgData.data.url;
                    }
                }

                // 2. Susun payload data pengaduan
                const payload = {
                    noPengaduan: "ADU-" + Date.now(),
                    tglPengaduan: document.getElementById('tanggal').value || "",
                    media: document.getElementById('media').value || "",
                    nama: document.getElementById('nama').value || "",
                    isiAduan: document.getElementById('isi').value || "",
                    tindakLanjut: document.getElementById('tindakLanjut').value || "",
                    tglTL: document.getElementById('tanggalTL').value || "",
                    statusTL: document.getElementById('statusTL').value || "",
                    durasi: document.getElementById('durasi').value || "",
                    kesimpulan: document.getElementById('kesimpulan').value || "",
                    imageUrl: imageUrl
                };

                // 3. Kirim data ke Apps Script
                const response = await fetch('https://script.google.com/macros/s/AKfycbw5VjBLMQceWgMboo6R8Zx5r2tSJgiDyP56SfIWSfRU2G_KftUpctH7Dak-HV6DbSt-/exec', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.result === "success") {
                    alert("Pengaduan dan Foto Berhasil Terkirim!");
                    this.reset();
                    document.getElementById('tanggal').valueAsDate = new Date();
                } else {
                    alert("Gagal mengirim: " + (data.error || "Terjadi kesalahan pada server."));
                }
            } catch (err) {
                console.error(err);
                alert("Terjadi kesalahan saat mengunggah data.");
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.querySelector('span').innerText = "Kirim Pengaduan ke Sistem";
            }
        });
    </script>
